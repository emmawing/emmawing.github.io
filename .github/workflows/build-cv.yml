name: Build PDF

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */6 * * *'   # rebuilds every 6 hours regardless of trigger source

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout CV repo
        uses: actions/checkout@v4
        with:
          repository: emmawing/wing_cv
          ref: main
          path: cv-source
          token: ${{ secrets.CV_OVERLEAF_SECRET }}

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: wing_cv.tex
          working_directory: cv-source
          latexmk_use_xelatex: true
          
      - name: Move PDF into site folder
        run: |
          mkdir -p files
          cp cv-source/wing_cv.pdf files/wing_cv.pdf

      - name: Commit and push PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build PDF from LaTeX source"
          file_pattern: files/wing_cv.pdf
